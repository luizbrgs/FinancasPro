<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FinançasPro</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg:     #eef0f4;
    --bg2:    #f7f8fa;
    --bg3:    #e6e8ed;
    --bg4:    #d8dbe3;
    --border: #d0d3da;
    --border2:#c4c7d0;
    --text:   #1c1e2a;
    --text2:  #52566a;
    --text3:  #8c90a4;
    --green:  #0a9e6e;
    --green-dim: rgba(10,158,110,0.13);
    --red:    #d63651;
    --red-dim: rgba(214,54,81,0.13);
    --blue:   #2563eb;
    --blue-dim: rgba(37,99,235,0.13);
    --amber:  #c2710c;
    --amber-dim: rgba(194,113,12,0.13);
    --purple: #6d28d9;
    --purple-dim: rgba(109,40,217,0.13);
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }
  body.dark {
    --bg: #0f0f13;
    --bg2: #16161d;
    --bg3: #1e1e28;
    --bg4: #252533;
    --border: #2a2a3a;
    --border2: #353548;
    --text: #e8e8f0;
    --text2: #9090a8;
    --text3: #5a5a72;
    --green: #00e699;
    --green-dim: rgba(0,230,153,0.12);
    --red: #ff4d6d;
    --red-dim: rgba(255,77,109,0.12);
    --blue: #4d9eff;
    --blue-dim: rgba(77,158,255,0.12);
    --amber: #ffb347;
    --amber-dim: rgba(255,179,71,0.12);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.12);
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    background: #0f0f13;
    color: #e8e8f0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }
  .app { display: flex; min-height: 100vh; }
  .sidebar { width: 220px; background: var(--bg2); border-right: 1px solid var(--border); padding: 0; display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; z-index: 100; }
  .main { flex: 1; margin-left: 220px; padding: 28px 32px; min-height: 100vh; }
  .logo { padding: 24px 20px; border-bottom: 1px solid var(--border); }
  .logo-text { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  .logo-text span { color: var(--green); }
  .nav { padding: 12px 0; flex: 1; }
  .nav-section { padding: 8px 16px 4px; font-size: 11px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 20px; cursor: pointer; color: var(--text2); font-size: 13.5px; transition: all 0.15s; position: relative; }
  .nav-item.active { background: var(--green-dim); color: var(--green); font-weight: 500; }
  .nav-item.active::before { content: ''; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; background: var(--green); border-radius: 0 2px 2px 0; }
  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .page-title { font-size: 22px; font-weight: 600; letter-spacing: -0.5px; }
  .btn { display: inline-flex; align-items: center; gap: 7px; padding: 9px 16px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all 0.15s; font-family: inherit; }
  .btn-primary { background: var(--green); color: #0a1a12; }
  .btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border2); }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card-title { font-size: 12px; font-weight: 500; color: var(--text3); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
  .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .metric-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
  .metric-label { font-size: 11.5px; color: var(--text3); font-weight: 500; text-transform: uppercase; margin-bottom: 6px; }
  .metric-value { font-size: 26px; font-weight: 600; font-family: 'DM Mono', monospace; }
  .metric-green .metric-value { color: var(--green); }
  .metric-red .metric-value { color: var(--red); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 10px 14px; font-size: 11.5px; color: var(--text3); border-bottom: 1px solid var(--border); }
  td { padding: 12px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
  .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .modal-overlay.open { opacity: 1; pointer-events: all; }
  .modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: 16px; padding: 28px; width: 100%; max-width: 500px; max-height: 90vh; overflow-y: auto; }
  .form-group { margin-bottom: 16px; }
  .form-label { display: block; font-size: 12.5px; font-weight: 500; color: var(--text2); margin-bottom: 6px; }
  .form-input, .form-select { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 10px 12px; color: var(--text); font-size: 14px; outline: none; }
  .radio-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .radio-option { padding: 8px 14px; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; transition: all 0.15s; }
  .radio-option.selected { background: var(--green-dim); border-color: var(--green); color: var(--green); font-weight: 500; }
  .radio-option input { display: none; }
  .recurrence-fields { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-top: 8px; }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; margin-left: 6px; }
  .sync-dot.syncing { background: var(--amber); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }
  .loading-overlay { position: fixed; inset: 0; background: rgba(15,15,19,0.9); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; }
  .loading-overlay.hidden { display: none; }
  .spinner { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--border2); border-top-color: var(--green); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border2); border-radius: 20px; padding: 10px 20px; font-size: 13px; z-index: 5000; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .inst-badge { font-size: 10.5px; padding: 2px 7px; border-radius: 10px; background: var(--purple-dim); color: var(--purple); font-weight: 500; }
  .rec-badge { font-size: 10.5px; padding: 2px 7px; border-radius: 10px; background: var(--blue-dim); color: var(--blue); font-weight: 500; }
  .toggle { position: relative; display: inline-block; width: 40px; height: 22px; }
  .toggle input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: var(--bg4); border-radius: 22px; cursor: pointer; transition: 0.2s; }
  .toggle-slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: 0.2s; }
  .toggle input:checked + .toggle-slider { background: var(--green); }
  .toggle input:checked + .toggle-slider:before { transform: translateX(18px); }

  @media (max-width: 768px) {
    .sidebar { display: none; }
    .main { margin-left: 0; padding: 14px 12px 80px; }
    .grid-4 { grid-template-columns: 1fr 1fr; gap: 8px; }
    .page-title { font-size: 18px; }
    .modal { padding: 22px 18px; }
  }
</style>
</head>
<body>

<div class="auth-screen" id="auth-screen" style="position:fixed;inset:0;background:var(--bg);z-index:9998;display:flex;align-items:center;justify-content:center;">
    <div style="background:var(--bg2);padding:40px;border-radius:20px;border:1px solid var(--border);width:100%;max-width:380px;">
        <div style="text-align:center;margin-bottom:30px;">
            <h2 class="logo-text">Finanças<span>Pro</span></h2>
        </div>
        <div id="auth-error" style="background:var(--red-dim);color:var(--red);padding:10px;border-radius:8px;margin-bottom:15px;display:none;font-size:13px;"></div>
        <div class="form-group">
            <label class="form-label">E-mail</label>
            <input type="email" id="login-email" class="form-input" placeholder="seu@email.com">
        </div>
        <div class="form-group">
            <label class="form-label">Senha</label>
            <input type="password" id="login-pass" class="form-input" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" onclick="doLogin()">Entrar</button>
    </div>
</div>

<div class="loading-overlay hidden" id="loading-overlay"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-text">Finanças<span>Pro</span><span class="sync-dot" id="sync-dot"></span></div>
    </div>
    <nav class="nav">
      <div class="nav-section">Principal</div>
      <div class="nav-item active" onclick="showPage('dashboard')">📊 Dashboard</div>
      <div class="nav-item" onclick="showPage('lancamentos')">💸 Lançamentos</div>
      <div class="nav-section">Controle</div>
      <div class="nav-item" onclick="showPage('cartoes')">💳 Cartões</div>
      <div class="nav-item" onclick="showPage('orcamento')">🎯 Orçamento</div>
      <div class="nav-item" onclick="showPage('metas')">🏆 Metas</div>
    </nav>
    <div style="padding:20px;"><button class="btn btn-secondary" style="width:100%" onclick="toggleTheme()">🌙 Modo Escuro</button></div>
  </aside>

  <main class="main">
    <div id="page-dashboard" class="page active">
      <div class="page-header">
        <div><div class="page-title">Dashboard</div><div id="dash-date" style="font-size:13px;color:var(--text2)"></div></div>
        <button class="btn btn-primary" onclick="openModal('add-transaction')">+ Lançamento</button>
      </div>
      <div class="grid-4 section-gap" id="dash-metrics" style="margin-bottom:24px"></div>
      <div class="card">
        <div class="card-title">Fluxo de Caixa</div>
        <div style="height:250px"><canvas id="chart-flow"></canvas></div>
      </div>
    </div>

    <div id="page-lancamentos" class="page" style="display:none">
        <div class="page-header">
            <div class="page-title">Lançamentos</div>
            <button class="btn btn-primary" onclick="openModal('add-transaction')">+ Novo</button>
        </div>
        <div class="card">
            <div class="table-wrap">
                <table>
                    <thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Status</th><th style="text-align:right">Valor</th><th></th></tr></thead>
                    <tbody id="trans-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
  </main>
</div>

<!-- Modal Transação -->
<div class="modal-overlay" id="modal-add-transaction">
  <div class="modal">
    <div class="modal-title" style="display:flex;justify-content:space-between;margin-bottom:20px;">
        <h3>Novo Lançamento</h3>
        <button onclick="closeModal('add-transaction')" style="background:none;border:none;cursor:pointer;font-size:18px;color:var(--text3)">✕</button>
    </div>
    <form onsubmit="saveTransaction(event)">
      <div class="form-group">
        <label class="form-label">Tipo</label>
        <div class="radio-group">
          <label class="radio-option selected" id="ro-despesa" onclick="setType('despesa')">💸 Despesa</label>
          <label class="radio-option" id="ro-receita" onclick="setType('receita')">💰 Receita</label>
          <input type="hidden" id="trans-type" value="despesa">
        </div>
      </div>
      <div class="form-group"><label class="form-label">Data</label><input type="date" id="trans-date" class="form-input" required></div>
      <div class="form-group"><label class="form-label">Descrição</label><input type="text" id="trans-desc" class="form-input" required></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <div class="form-group"><label class="form-label">Valor (R$)</label><input type="number" id="trans-value" class="form-input" step="0.01" required></div>
        <div class="form-group"><label class="form-label">Categoria</label><select id="trans-cat" class="form-select"></select></div>
      </div>
      <div class="form-group">
        <label class="form-label">Recorrência</label>
        <div class="radio-group" id="rec-group">
          <label class="radio-option selected" id="opt-unico" onclick="setRecurrence('unico')">Único</label>
          <label class="radio-option" id="opt-parcelado" onclick="setRecurrence('parcelado')">Parcelado</label>
          <label class="radio-option" id="opt-mensal" onclick="setRecurrence('mensal')">Mensal</label>
        </div>
      </div>
      <div id="rec-fields" class="recurrence-fields" style="display:none">
        <div id="rec-parcelas"><label class="form-label">Parcelas</label><input type="number" id="trans-parcelas" class="form-input" min="2" value="2"></div>
      </div>
      <div class="form-group" style="display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--bg3);border-radius:8px;margin-top:10px;">
          <span>Já foi pago/recebido?</span>
          <label class="toggle"><input type="checkbox" id="trans-paid" checked><span class="toggle-slider"></span></label>
      </div>
      <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end;">
        <button type="button" class="btn btn-secondary" onclick="closeModal('add-transaction')">Cancelar</button>
        <button type="submit" class="btn btn-primary">Salvar Lançamento</button>
      </div>
    </form>
  </div>
</div>

<script>
const CATS_EXPENSE = [{id:'alimentacao', name:'Alimentação', icon:'🍔', color:'#ff9f43'},{id:'moradia', name:'Moradia', icon:'🏠', color:'#4d9eff'},{id:'saude', name:'Saúde', icon:'💊', color:'#ff4d6d'},{id:'lazer', name:'Lazer', icon:'🎮', color:'#00e699'},{id:'outros_d', name:'Outros', icon:'💸', color:'#636e72'}];
const CATS_INCOME = [{id:'salario', name:'Salário', icon:'💼', color:'#00e699'},{id:'freelance', name:'Freelance', icon:'💻', color:'#4d9eff'},{id:'investimentos', name:'Investimentos', icon:'📈', color:'#ffb347'}];
const ALL_CATS = [...CATS_EXPENSE, ...CATS_INCOME];

let state = { transactions: [], cards: [], budgets: {}, goals: [] };
let selectedRecurrence = 'unico';

const fmt = v => 'R$ ' + Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2});
const today = () => new Date().toISOString().slice(0,10);
const getCat = id => ALL_CATS.find(c=>c.id===id) || {name:id,icon:'❓',color:'#888'};

// Helper para formatar data local ISO
function formatDateLocal(date) {
    const y = date.getFullYear();
    const m = String(date.getMonth() + 1).padStart(2, '0');
    const d = String(date.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
    document.getElementById('page-' + page).style.display = 'block';
    if(page === 'lancamentos') renderTransactions();
    if(page === 'dashboard') renderDashboard();
}

function openModal(name) {
    if(name === 'add-transaction') {
        document.getElementById('trans-date').value = today();
        setType('despesa');
        setRecurrence('unico');
    }
    document.getElementById('modal-' + name).classList.add('open');
}

function closeModal(name) { document.getElementById('modal-' + name).classList.remove('open'); }

function setType(type) {
    document.getElementById('trans-type').value = type;
    document.getElementById('ro-despesa').classList.toggle('selected', type==='despesa');
    document.getElementById('ro-receita').classList.toggle('selected', type==='receita');
    const sel = document.getElementById('trans-cat');
    const cats = type === 'receita' ? CATS_INCOME : CATS_EXPENSE;
    sel.innerHTML = cats.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');
}

function setRecurrence(type) {
    selectedRecurrence = type;
    document.querySelectorAll('#rec-group .radio-option').forEach(opt => opt.classList.remove('selected'));
    document.getElementById('opt-' + type).classList.add('selected');
    document.getElementById('rec-fields').style.display = type === 'unico' ? 'none' : 'block';
    document.getElementById('rec-parcelas').style.display = type === 'parcelado' ? 'block' : 'none';
}

function saveTransaction(e) {
    e.preventDefault();
    const type = document.getElementById('trans-type').value;
    const date = document.getElementById('trans-date').value;
    const desc = document.getElementById('trans-desc').value;
    const value = Math.round(parseFloat(document.getElementById('trans-value').value) * 100) / 100;
    const cat = document.getElementById('trans-cat').value;
    const paid = document.getElementById('trans-paid').checked;
    const recurrence = selectedRecurrence;
    const baseId = Date.now();

    const base = { type, desc, value, cat, recurrence, paid };

    if (recurrence === 'parcelado') {
        const n = parseInt(document.getElementById('trans-parcelas').value) || 2;
        for (let i = 0; i < n; i++) {
            let d = new Date(date + 'T00:00:00');
            d.setMonth(d.getMonth() + i);
            state.transactions.push({
                ...base,
                id: baseId + i,
                date: formatDateLocal(d),
                parcelaDesc: `${i + 1}/${n}`,
                paid: i === 0 ? paid : false
            });
        }
    } else if (recurrence === 'mensal') {
        for (let i = 0; i < 12; i++) {
            let d = new Date(date + 'T00:00:00');
            d.setMonth(d.getMonth() + i);
            state.transactions.push({
                ...base,
                id: baseId + i,
                date: formatDateLocal(d),
                paid: i === 0 ? paid : false
            });
        }
    } else {
        state.transactions.push({ ...base, id: baseId, date, recurrence: 'unico' });
    }

    localStorage.setItem('finpro_state', JSON.stringify(state));
    closeModal('add-transaction');
    showToast('✓ Lançamento salvo');
    renderCurrentView();
}

function renderCurrentView() {
    renderTransactions();
    renderDashboard();
}

function renderTransactions() {
    const tbody = document.getElementById('trans-tbody');
    const txs = [...state.transactions].sort((a,b) => b.date.localeCompare(a.date));
    tbody.innerHTML = txs.map(t => {
        const c = getCat(t.cat);
        return `<tr>
            <td>${t.date.split('-').reverse().join('/')}</td>
            <td><div style="font-weight:500">${t.desc}</div>${t.parcelaDesc ? `<span class="inst-badge">${t.parcelaDesc}</span>` : ''}</td>
            <td><span class="badge" style="background:${c.color}22;color:${c.color}">${c.icon} ${c.name}</span></td>
            <td>${t.paid ? '✅ Pago' : '⏳ Pendente'}</td>
            <td style="text-align:right;font-weight:600;color:${t.type==='receita'?'var(--green)':'var(--red)'}">${t.type==='receita'?'+':'-'} ${fmt(t.value)}</td>
            <td><button onclick="deleteTx(${t.id})" style="border:none;background:none;cursor:pointer">🗑</button></td>
        </tr>`;
    }).join('');
}

function deleteTx(id) {
    state.transactions = state.transactions.filter(t => t.id !== id);
    localStorage.setItem('finpro_state', JSON.stringify(state));
    renderCurrentView();
}

function renderDashboard() {
    const now = new Date();
    const m = now.getMonth(), y = now.getFullYear();
    const monthTxs = state.transactions.filter(t => {
        const [ty, tm] = t.date.split('-').map(Number);
        return ty === y && tm - 1 === m;
    });

    const inc = Math.round(monthTxs.filter(t=>t.type==='receita').reduce((a,t)=>a+t.value,0)*100)/100;
    const exp = Math.round(monthTxs.filter(t=>t.type==='despesa').reduce((a,t)=>a+t.value,0)*100)/100;

    document.getElementById('dash-metrics').innerHTML = `
        <div class="metric-card metric-green"><div class="metric-label">Receitas</div><div class="metric-value">${fmt(inc)}</div></div>
        <div class="metric-card metric-red"><div class="metric-label">Despesas</div><div class="metric-value">${fmt(exp)}</div></div>
        <div class="metric-card"><div class="metric-label">Saldo Mês</div><div class="metric-value">${fmt(inc-exp)}</div></div>
        <div class="metric-card"><div class="metric-label">Pendentes</div><div class="metric-value" style="color:var(--amber)">${monthTxs.filter(t=>!t.paid).length}</div></div>
    `;
    document.getElementById('dash-date').textContent = now.toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
}

function doLogin() {
    document.getElementById('auth-screen').style.display = 'none';
    const saved = localStorage.getItem('finpro_state');
    if(saved) state = JSON.parse(saved);
    renderDashboard();
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

function toggleTheme() { document.body.classList.toggle('dark'); }

window.onload = () => { if(localStorage.getItem('finpro_state')) state = JSON.parse(localStorage.getItem('finpro_state')); };
</script>
</body>
</html>
